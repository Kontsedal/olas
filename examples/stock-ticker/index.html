<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olas stock ticker — vanilla</title>
  </head>
  <body class="m-0 px-6 pb-10 pt-6 max-w-5xl mx-auto">
    <header class="flex items-baseline justify-between gap-4 pb-3 mb-5 border-b border-(--color-border) flex-wrap">
      <div>
        <h1 class="m-0 text-xl font-bold tracking-tight">Olas stock ticker</h1>
        <p class="m-0 text-[length:var(--text-meta)] text-(--color-fg-mute)">
          Vanilla TS · signals + emitter + throttled + persisted
        </p>
      </div>
      <div class="font-mono text-[length:var(--text-meta)] text-(--color-fg-mute)">no react · no template engine</div>
    </header>

    <section class="rounded-[var(--radius-surface)] border border-(--color-border) bg-(--color-bg-elev) p-4 mb-4">
      <h2 class="m-0 mb-3 text-[length:var(--text-mark)] font-semibold uppercase text-(--color-fg-mute)">
        Portfolio
      </h2>
      <div class="flex items-baseline gap-3">
        <span class="text-[length:var(--text-mark)] text-(--color-fg-mute) uppercase">Total</span>
        <span id="total" class="font-mono text-3xl font-bold tracking-tight tabular-nums">—</span>
      </div>
      <ul id="watchlist" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 list-none p-0 m-0 mt-3"></ul>
    </section>

    <section id="details-section" class="rounded-[var(--radius-surface)] border border-(--color-border) bg-(--color-bg-elev) p-4 mb-4 hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="m-0 text-[length:var(--text-mark)] font-semibold uppercase text-(--color-fg-mute)">
          Details · <span id="details-symbol" class="font-mono text-(--color-fg)">—</span>
        </h2>
        <button id="details-close" type="button" class="text-(--color-fg-mute) hover:text-(--color-fg) text-[length:var(--text-meta)]">close</button>
      </div>
      <div id="details-stats" class="flex gap-6 mb-3 text-[length:var(--text-body)] font-mono tabular-nums"></div>
      <ul id="details-trades" class="m-0 p-0 list-none flex flex-col gap-1 max-h-72 overflow-auto"></ul>
    </section>

    <section class="rounded-[var(--radius-surface)] border border-(--color-border) bg-(--color-bg-elev) p-4 mb-4">
      <h2 class="m-0 mb-3 text-[length:var(--text-mark)] font-semibold uppercase text-(--color-fg-mute)">
        Search &amp; add symbols
        <span class="ml-2 text-[length:var(--text-mark)] font-normal normal-case tracking-normal opacity-60">(debounced 200ms)</span>
      </h2>
      <div class="flex flex-col gap-2">
        <input
          id="search"
          class="rounded-[var(--radius-surface)] border border-(--color-border) bg-(--color-bg-sunk) px-3 py-2 text-[length:var(--text-body)] placeholder:text-(--color-fg-mute) outline-none focus:border-(--color-accent) focus:ring-2 focus:ring-(--color-accent)/30"
          placeholder="Search by symbol or name…"
          autocomplete="off"
        />
        <ul id="results" class="m-0 p-0 list-none max-h-60 overflow-auto rounded-[var(--radius-surface)] border border-(--color-border)"></ul>
      </div>
    </section>

    <section class="rounded-[var(--radius-surface)] border border-(--color-border) bg-(--color-bg-elev) p-4 mb-4">
      <h2 class="m-0 mb-3 text-[length:var(--text-mark)] font-semibold uppercase text-(--color-fg-mute)">
        Price alerts
      </h2>
      <div class="flex flex-col gap-2">
        <div class="grid grid-cols-[110px_90px_1fr_auto] gap-2 items-center">
          <select id="alert-symbol" class="rounded-[var(--radius-control)] border border-(--color-border) bg-(--color-bg-sunk) px-2 py-1.5 text-[length:var(--text-body)] font-mono"></select>
          <select id="alert-direction" class="rounded-[var(--radius-control)] border border-(--color-border) bg-(--color-bg-sunk) px-2 py-1.5 text-[length:var(--text-body)] font-mono">
            <option value="above">above</option>
            <option value="below">below</option>
          </select>
          <input
            id="alert-target"
            class="rounded-[var(--radius-control)] border border-(--color-border) bg-(--color-bg-sunk) px-2 py-1.5 text-[length:var(--text-body)] font-mono"
            type="number"
            step="0.01"
            placeholder="target"
          />
          <button
            id="alert-add"
            type="button"
            class="rounded-[var(--radius-control)] bg-(--color-accent) px-3 py-1.5 text-[length:var(--text-body)] font-medium text-(--color-accent-fg) hover:bg-(--color-accent-hover)"
          >
            Add alert
          </button>
        </div>
        <ul id="alerts" class="m-0 p-0 list-none flex flex-col gap-1"></ul>
      </div>
    </section>

    <div id="toast-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
