name: Release

# Changesets-driven release. On a push to `main`:
#  - if there are pending changesets, the action opens/updates a
#    "Version Packages" PR (runs `changeset version`) — nothing publishes yet;
#  - when that PR merges (changesets consumed), the action runs `pnpm release`
#    (`pnpm build && changeset publish`) to publish to npm.
#
# Requires an `NPM_TOKEN` repository secret. Until it is set, `changeset publish`
# has no auth and publishes nothing — so this workflow cannot publish by
# accident. Only runs on `main`, never on feature branches.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: version / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
