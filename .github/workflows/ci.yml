name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Runs the full suite WITH coverage so the thresholds in vitest.config.ts
      # are enforced (a real coverage regression fails CI). (T7.2)
      - run: pnpm test:coverage

      # The examples ship their own vitest configs (react plugin + jsdom) and
      # are excluded from the root `pnpm test` include, so run them explicitly.
      - run: pnpm --filter "./examples/*" test

      - run: pnpm build

      # Verify the shipped ARTIFACTS, not just the source (T7.2). Runs after
      # build so it checks real dist/: publint (packaging metadata), attw (type
      # resolution across CJS/ESM), and a smoke test that ESM+CJS actually load
      # and no `__DEV__` literal leaked into the production output.
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm smoke:dist
