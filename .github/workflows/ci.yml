name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Only `coverage-badge` writes, and only to its branch.
permissions:
  contents: read

jobs:
  ci:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build FIRST: the satellite packages + examples typecheck against core's
      # built `dist/*.d.ts` (via package `exports`), not its src — running
      # typecheck before build fails with "Cannot find module
      # '@kontsedal/olas-core'". (Local `pnpm typecheck` has the same
      # prerequisite.)
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      # Every internal peer range keeps an upper bound (scripts/pin-peer-ranges.mjs).
      - run: pnpm check:peer-ranges

      # A pending release that leaves a package's peer range behind needs a
      # major changeset for that package; changesets 3 would bump it by a patch.
      - run: pnpm check:peer-bumps

      # Every TypeScript block in the README, API, RECIPES, PLUGINS, MIGRATING
      # and package READMEs compiles against the current sources, so a copied
      # example does not fail for the reader.
      - run: pnpm check:doc-snippets

      # Runs the full suite WITH coverage so the thresholds in vitest.config.ts
      # are enforced (a real coverage regression fails CI). (T7.2)
      - run: pnpm test:coverage

      # The examples ship their own vitest configs (react plugin + jsdom) and
      # are excluded from the root `pnpm test` include, so run them explicitly.
      - run: pnpm --filter "./examples/*" test

      # Verify the shipped ARTIFACTS, not just the source (T7.2), against the
      # dist/ built above: publint (packaging metadata), attw (type resolution,
      # ESM-only profile), and a smoke test that the entry imports, loads through
      # require(), and leaked no `__DEV__` literal into the production output.
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm smoke:dist

      # Every type a public signature names must be exported, so a consumer
      # can write down what a hover shows them.
      - run: pnpm check:public-types

      # The checked-in API reports (packages/*/etc/*.api.md) match the built
      # declarations, so a public-surface change shows up as a reviewable diff.
      # After an intended change: pnpm api:update, and commit the reports.
      - run: pnpm api:check

      # Bundle-size budgets, per entry, against the built dist (.size-limit.json).
      - run: pnpm size

      # The README's coverage badge, from this run's totals. It is built last, so
      # a push to main that fails any check above leaves the badge as it was.
      - if: github.event_name == 'push'
        run: node scripts/coverage-badge.mjs
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage/badge.json
          retention-days: 1

  # Publishes the badge to the `badges` branch, which holds one file in one
  # commit, force-pushed each time. The README reads it through shields.io.
  # This job runs no repo code, so the write token never meets a build step.
  coverage-badge:
    name: publish the coverage badge
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-badge

      - name: Push badge.json to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add badge.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "coverage badge for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  # The packages are ESM-only and promise that a CommonJS consumer can still
  # require() them on Node >= 20.19. Check that on the oldest supported Node and
  # the current LTS lines, against the built dist. The toolchain (tsdown, vitest,
  # jsdom) needs Node 22.22 or later, so the dist is built on 22 and only the
  # smoke check runs on the matrix Node.
  dist-on-node:
    name: dist loads on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # `node` itself, not `pnpm smoke:dist`, so nothing but the check runs on
      # the matrix Node.
      - run: node scripts/verify-dist.mjs
