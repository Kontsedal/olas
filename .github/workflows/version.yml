name: Version

# Opens and maintains the "Version Packages" PR. It NEVER publishes.
#
# On a push to `main` with pending changesets, changesets/action runs
# `changeset version` on a branch and opens (or updates) a PR containing the
# version bumps and CHANGELOG entries. Merging that PR consumes the changesets
# and lands the new versions on `main` — still without publishing anything.
#
# Publishing is a separate, manually triggered workflow (`publish.yml`). The
# split is deliberate: merging a PR is a low-ceremony action that several people
# can do, while pushing to npm is irreversible (a version number can never be
# reused, even after `npm unpublish`). Those should not be the same gesture.
#
# Packages version INDEPENDENTLY — there is no `fixed` group in
# `.changeset/config.json`, so a package bumps only when a changeset names it or
# when a dependency moves outside its declared peer range. Changesets makes the
# second a patch; `check:peer-bumps` fails until a changeset names it as major.
on:
  push:
    branches: [main]

concurrency: version-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: open or update the Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `changeset version` exits 1 when it finds no changeset, and the action
      # runs it anyway. So the push that merges the Version Packages PR, and
      # every later push without a changeset, turned main red. With nothing to
      # version, the job now skips the rest and passes.
      - name: Look for changesets to version
        id: pending
        run: echo "count=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)" >> "$GITHUB_OUTPUT"

      - if: steps.pending.outputs.count != '0'
        uses: pnpm/action-setup@v6.1.0

      - if: steps.pending.outputs.count != '0'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.pending.outputs.count != '0'
        run: pnpm install --frozen-lockfile

      # The `version` sub-action can only open or update the PR; it has no
      # publish path at all. That is what keeps this workflow incapable of
      # releasing.
      - name: Create or update the version PR
        if: steps.pending.outputs.count != '0'
        uses: changesets/action/version@v2.1.2
        with:
          # `version-packages` fails first if a pending release leaves a
          # package's peer range behind without a major changeset for it
          # (scripts/check-peer-bumps.mjs), then versions, then restores any
          # upper bound an internal peer range lost (scripts/pin-peer-ranges.mjs).
          script: pnpm version-packages
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
